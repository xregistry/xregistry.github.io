name: Publish scheduled articles

on:
  schedule:
    - cron: "0 15 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-scheduled-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish due articles
        run: bash scripts/publish-due-articles.sh

      - name: Commit published articles
        id: commit
        run: |
          if git diff --quiet -- _articles; then
            echo "No articles are due."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _articles
          git commit -m "Publish scheduled blog articles"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Deploy published articles
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main